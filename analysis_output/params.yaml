laserMapping_quad0:
  calibration:
    PX4_R_I:
    - 0.0
    - 0.0
    - 0.0
    PX4_p_I:
    - 0.0
    - 0.0
    - 0.0
    accumulate_frame_en: false
    cut_frame_en: false
    cut_frame_num: 1
    gravity_align_enable: false
    gravity_align_time: 10
    level_horizon:
    - 0.0
    - 0.0
    - 0.0
    original_frequency: 10
