    drone_id: 0
    imu_topic: /quad_0/imu
    lid_topic: /quad0_pcl_render_node/sensor_cloud
    time_offset_lidar_imu: 0.0
  imu_propagate:
    enable: true
    filter_acc_en: false
    topic: /lidar_slam/imu_propagate
  mapping:
    LI_extrinsic_R:
    - 1
    - 0
    - 0
    - 0
    - 1
    - 0
    - 0
    - 0
    - 1
    LI_extrinsic_T:
    - 0.0
    - 0.0
    - 0.0
    acc_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    cube_side_length: 2000
    det_range: 15
    filter_size_map: 0.3
    filter_size_surf: 0.3
    gyr_cov: 0.1
    imu_en: true
    max_iteration: 3
    point_filter_num: 2
  multiuav:
    actual_uav_num: 3
    ave_match_error_thresh: 0.22
    cluster_extraction_in_predict_region: true
    degeneration_thresh: 10
    dynamic_filter_radius: 1.2
    frame_num_in_sliding_window: 1
    inten_threshold: 0.6
    min_cluster_size: 4
    min_high_inten_cluster_size: 3
    min_traj_match_points: 35
    mutual_observe_noise: 0.001
    observation_stale_time: 1.2
    pos_num_in_traj: 140
    predict_region_radius: 1.15
    reset_tracker_thresh: 5.0
    same_obj_thresh: 0.8
    static_reject_duration: 8.0
    static_reject_radius: 1.0
    temp_predict_region_radius: 0.95
    temp_tracker_max_miss_time: 4.0
    temp_tracker_min_motion: 0.35
    temp_tracker_static_grace_time: 5.0
    temp_tracker_static_max_time: 5.0
    traj_match_current_dist_thresh: 0.45
    traj_match_max_error_thresh: 0.5
    traj_matching_start_thresh: 0.4
    traj_time_tolerance: 0.04
    valid_cluster_dist_thresh: 0.75
    valid_cluster_size_thresh: 1.15
    valid_temp_cluster_dist_thresh: 0.85
  pcd_save:
    interval: -1
    pcd_save_en: false
  preprocess:
    blind: 0.4
    feature_extract_en: false
    lidar_type: 6
    scan_line: 6
  publish:
    dense_publish_en: false
    path_en: true
    scan_bodyframe_pub_en: false
    scan_publish_en: true
  sub_gt_pose_topic: /quad_0/lidar_slam/odom
